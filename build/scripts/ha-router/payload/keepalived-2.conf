global_defs {
    router_id HA_2
    script_user root
    enable_script_security
}
vrrp_script chk_local {
    script "/usr/libexec/ha-check"
    interval 5
    timeout 12
    fall 3
    rise 3
    init_fail
}
vrrp_instance LAN_HA {
    state BACKUP
    interface br-lan
    virtual_router_id 218
    priority 150
    advert_int 1
    version 3
    nopreempt
    unicast_src_ip 172.18.18.2
    unicast_peer {
        172.18.18.8
    }
    check_unicast_src
    virtual_ipaddress {
        172.18.18.18/24 dev br-lan
    }
    garp_master_delay 0
    garp_master_repeat 5
    garp_master_refresh 30
    track_script {
        chk_local
    }
    notify_master "/usr/libexec/ha-role MASTER"
    notify_backup "/usr/libexec/ha-role BACKUP"
    notify_fault "/usr/libexec/ha-role FAULT"
    notify_stop "/usr/libexec/ha-role STOP"
}
