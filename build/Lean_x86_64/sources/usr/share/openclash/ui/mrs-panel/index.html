<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRS 延迟面板 · 最近 10 次连通记录</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --fg:#e6e8ee; --dim:#8b93a7; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5c5c; --acc:#4c8dff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  a{color:var(--acc);text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0f1115 70%,rgba(15,17,21,.85));border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  header .sub{color:var(--dim);font-size:12px}
  header .spacer{flex:1}
  input,button,select{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px}
  button{cursor:pointer}
  button:hover{border-color:var(--acc)}
  .wrap{padding:14px 16px 60px;max-width:1400px;margin:0 auto}
  h2{font-size:13px;color:var(--dim);font-weight:600;margin:18px 0 8px;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .card .name{font-weight:600}
  .card .now{color:var(--dim);font-size:12px;margin-top:4px;word-break:break-all}
  .card .now b{color:var(--fg);font-weight:600}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--dim);font-weight:500;font-size:11px;position:sticky;top:57px;background:var(--bg)}
  tr:hover td{background:#1b1f28}
  .nm{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cur{color:var(--ok);font-weight:600}
  .delay{font-variant-numeric:tabular-nums;font-weight:600;cursor:help;position:relative;display:inline-block;min-width:52px}
  .d-ok{color:var(--ok)} .d-mid{color:var(--warn)} .d-bad{color:var(--bad)} .d-none{color:var(--dim)}
  .bars{display:inline-flex;gap:2px;align-items:flex-end;height:16px;cursor:help;position:relative}
  .bars i{width:4px;min-height:3px;border-radius:1px;background:var(--ok);display:block}
  .bars i.to{background:var(--bad);height:16px!important}
  .bars i.na{background:#39404e}
  .tip{display:none;position:absolute;z-index:50;left:0;top:20px;background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.6);min-width:190px;font-weight:400;color:var(--fg);white-space:nowrap}
  .delay:hover>.tip,.bars:hover>.tip{display:block}
  .tip .h{color:var(--dim);font-size:11px;margin-bottom:4px}
  .tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
  .tip .r span:first-child{color:var(--dim)}
  .tip .r.t span:last-child{color:var(--bad)}
  .score{color:var(--dim);font-variant-numeric:tabular-nums}
  .stat{display:flex;gap:14px;color:var(--dim);font-size:12px;flex-wrap:wrap}
  .stat b{color:var(--fg)}
  .err{background:#3a1414;border:1px solid #7a2626;color:#ffb4b4;padding:8px 10px;border-radius:8px;margin:10px 0}
  details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
  summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  summary::marker{color:var(--dim)}
  details .body{border-top:1px solid var(--line);padding:6px 8px 10px;overflow:auto;max-height:70vh}
  .lg{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:11px;padding:4px 2px}
  .lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<header>
  <h1>MRS 延迟面板</h1>
  <span class="sub">鼠标放到延迟/色条上 → 看该节点最近 10 次连通记录</span>
  <span class="spacer"></span>
  <input id="secret" type="password" placeholder="面板密码" style="width:130px" title="OpenClash 的 dashboard_password">
  <label class="sub"><input id="auto" type="checkbox" checked style="vertical-align:-2px"> 自动刷新</label>
  <span id="cd" class="sub"></span>
  <button id="refresh">刷新</button>
</header>

<div class="wrap">
  <div id="err"></div>
  <div class="stat" id="stat"></div>

  <h2>策略组（选择的是"组"）</h2>
  <div class="grid" id="cats"></div>

  <h2>模型优选（节点级分组，★=模型当前选中）</h2>
  <div id="groups"></div>

  <div class="lg">
    <span><i style="background:var(--ok)"></i> 正常</span>
    <span><i style="background:var(--warn)"></i> 偏慢(&gt;200ms)</span>
    <span><i style="background:var(--bad)"></i> 超时/失败</span>
    <span><i style="background:#39404e"></i> 无记录</span>
    <span>色条从左到右=从旧到新，共 10 次；延迟取自 mihomo 的 <code>history</code>，超时记为 0</span>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const CATS = ['🤖 AI平台','📲 社交聊天','💻 开发平台','🎥 国外媒体','Ⓜ️ 微软苹果','🐟 漏网之鱼','🎯 全球直连','🛑 全球拦截'];
const AUTO = ['♻️ 自动选择','♻️ 香港自动','♻️ 亚洲自动','♻️ 美国自动','♻️ 其他自动','🕸️ CHATGPT自动'];
const N = 10;
let proxies = {}, smart = null, timer = null, cd = 0;

// localStorage 在隐私模式/无源页面可能不可用，兜一下别让整页挂掉
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
$('#secret').value = store.get('mrs-secret') || 'CLJblvhE';
$('#secret').onchange = () => { store.set('mrs-secret', $('#secret').value); load(); };
$('#refresh').onclick = load;
$('#auto').onchange = () => { if ($('#auto').checked) startTimer(); else stopTimer(); };

function api(path){
  return fetch(path, { headers: { Authorization: 'Bearer ' + $('#secret').value } })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmmss = (t) => { const d = new Date(t); return isNaN(d) ? '--' : d.toLocaleTimeString('zh-CN', {hour12:false}); };
function cls(ms){ if (ms === null || ms === undefined) return 'd-none'; if (ms <= 0) return 'd-bad'; if (ms <= 200) return 'd-ok'; return 'd-mid'; }
function txt(ms){ if (ms === null || ms === undefined) return '—'; return ms <= 0 ? '超时' : ms + 'ms'; }

// 节点的测速记录。
// 注意：mihomo 对「HTTPS + Cloudflare」这类地址的 extra[url].history 会把成功也记成 delay=0
// （实测同一秒 oc-smart 记 483ms、mihomo 桶记 0；而通用地址两边完全一致），
// 所以这里**优先用 oc-smart 自己记录的那套**（也是模型评分用的那套），mihomo 桶只做兜底。
function smartRec(name, url){
  const k = (url || '') + '|' + name;
  const r = smart && smart.nodes && smart.nodes[k];
  return r ? r.slice(-N) : null;
}
function historyOf(name, url){
  const sr = smartRec(name, url);
  if (sr && sr.length) return sr.map(x => ({ time: x.t * 1000, delay: x.ms == null ? 0 : x.ms }));
  const p = proxies[name]; if (!p) return [];
  const ex = p.extra || {};
  if (url && ex[url] && Array.isArray(ex[url].history) && ex[url].history.length) return ex[url].history.slice(-N);
  if (Array.isArray(p.history) && p.history.length) return p.history.slice(-N);
  for (const k in ex) if (ex[k] && Array.isArray(ex[k].history) && ex[k].history.length) return ex[k].history.slice(-N);
  return [];
}

function tipHtml(name, url){
  const his = historyOf(name, url);
  if (!his.length) return '<div class="h">还没有测速记录</div>';
  const ok = his.filter(h => h.delay > 0);
  const to = his.length - ok.length;
  const head = '<div class="h">最近 ' + his.length + ' 次（正常 ' + ok.length + ' · 超时 ' + to + '）</div>';
  return head + his.slice().reverse().map(h =>
    '<div class="r' + (h.delay > 0 ? '' : ' t') + '"><span>' + hhmmss(h.time) + '</span><span>' + (h.delay > 0 ? h.delay + 'ms' : '超时') + '</span></div>').join('');
}
function barsHtml(name, url){
  const his = historyOf(name, url);
  if (!his.length) return '<span class="bars">' + '<i class="na"></i>'.repeat(N) + '<span class="tip">' + tipHtml(name, url) + '</span></span>';
  const max = Math.max(300, ...his.map(h => h.delay || 0));
  const cells = Array.from({length: N}, (_, i) => {
    const h = his[i - (N - his.length)];             // 左对齐：不足 10 条时前面留空
    if (!h) return '<i class="na"></i>';
    if (!h.delay) return '<i class="to"></i>';
    const hgt = Math.max(3, Math.round(16 * Math.min(1, h.delay / max)));
    const col = h.delay <= 200 ? 'var(--ok)' : 'var(--warn)';
    return '<i style="height:' + hgt + 'px;background:' + col + '"></i>';
  }).join('');
  return '<span class="bars">' + cells + '<span class="tip">' + tipHtml(name, url) + '</span></span>';
}

function lastName(group){
  const p = proxies[group]; if (!p || !p.all) return [];
  return p.all;
}
function scoreOf(name, url){
  const g = smart && smart.scores && smart.scores[(url || '') + '|' + name];
  return g ? g.score : null;
}
function renderCats(){
  $('#cats').innerHTML = CATS.filter(n => proxies[n]).map(n => {
    const p = proxies[n];
    return '<div class="card"><div class="t"><span class="name">' + esc(n) + '</span>' +
      '<span class="badge">' + esc(p.type) + '</span></div>' +
      '<div class="now">当前 → <b>' + esc(p.now || '-') + '</b></div></div>';
  }).join('');
}
function renderGroups(){
  $('#groups').innerHTML = AUTO.filter(n => proxies[n]).map(g => {
    const p = proxies[g];
    const turl = (smart && smart.groups && smart.groups[g] && smart.groups[g].test_url) || null;
    let rows = lastName(g).map(nm => {
      const his = historyOf(nm, turl);
      const last = his.length ? his[his.length - 1].delay : null;
      const sc = scoreOf(nm, turl);
      return { nm, last, sc, isCur: nm === p.now };
    });
    rows.sort((a, b) => (a.sc ?? 1e9) - (b.sc ?? 1e9) || (a.last || 1e9) - (b.last || 1e9));
    const alive = rows.filter(r => r.last && r.last > 0).length;
    const body = '<table><thead><tr><th>节点</th><th>最新</th><th>最近 10 次</th><th>得分</th></tr></thead><tbody>' +
      rows.map(r => '<tr>' +
        '<td class="nm' + (r.isCur ? ' cur' : '') + '" title="' + esc(r.nm) + '">' + (r.isCur ? '★ ' : '') + esc(r.nm) + '</td>' +
        '<td><span class="delay ' + cls(r.last) + '">' + txt(r.last) + '<span class="tip">' + tipHtml(r.nm, turl) + '</span></span></td>' +
        '<td>' + barsHtml(r.nm, turl) + '</td>' +
        '<td class="score">' + (r.sc == null ? '—' : r.sc) + '</td>' +
      '</tr>').join('') + '</tbody></table>';
    return '<details open><summary><b>' + esc(g) + '</b>' +
      '<span class="badge">' + esc(p.type) + '</span>' +
      '<span class="badge">成员 ' + (p.all ? p.all.length : 0) + '</span>' +
      '<span class="badge">' + alive + ' 个可用</span>' +
      (turl ? '<span class="badge" title="该分组的测速地址">测速 ' + esc(turl.replace(/^https?:\/\//, '')) + '</span>' : '') +
      '<span class="spacer" style="flex:1"></span><span class="now">当前 → <b>' + esc(p.now || '-') + '</b></span>' +
      '</summary><div class="body">' + body + '</div></details>';
  }).join('');
}
async function load(){
  $('#err').innerHTML = '';
  try {
    proxies = (await api('/proxies')).proxies || {};
  } catch (e) {
    $('#err').innerHTML = '<div class="err">读取 mihomo API 失败：' + esc(e.message) +
      ' —— 检查上面的面板密码（OpenClash 的 dashboard_password），并从路由器上打开本页（同源）。</div>';
    return;
  }
  try { smart = await (await fetch('history.json?_=' + Date.now())).json(); } catch (e) { smart = null; }
  renderCats(); renderGroups();
  const all = AUTO.filter(n => proxies[n]).flatMap(g => lastName(g));
  const uniq = [...new Set(all)];
  const h = uniq.map(historyOf);
  const withRec = h.filter(x => x.length).length;
  const alive = h.filter(x => x.length && x[x.length - 1].delay > 0).length;
  $('#stat').innerHTML =
    '<span>节点去重 <b>' + uniq.length + '</b></span>' +
    '<span>有记录 <b>' + withRec + '</b></span>' +
    '<span>最近一次正常 <b>' + alive + '</b></span>' +
    '<span>每节点保留 <b>' + N + '</b> 次</span>' +
    '<span>更新于 <b>' + new Date().toLocaleTimeString('zh-CN', {hour12:false}) + '</b>' +
    (smart && smart.groups ? '<span>专用测速地址 <b>' + Object.values(smart.groups).map(x => x.test_url).filter((v,i,a) => a.indexOf(v)===i).length + '</b> 种</span>' : '') +
    (smart && smart.updated ? '（模型记录 ' + hhmmss(smart.updated * 1000) + '）' : '（无模型记录文件，仅用内核历史）') + '</span>';
}
function startTimer(){ stopTimer(); cd = 30; $('#cd').textContent = cd + 's'; timer = setInterval(() => { cd--; $('#cd').textContent = cd + 's'; if (cd <= 0) { cd = 30; load(); } }, 1000); }
function stopTimer(){ if (timer) clearInterval(timer); timer = null; $('#cd').textContent = ''; }
load().then(() => { if ($('#auto').checked) startTimer(); });
</script>
</body>
</html>
