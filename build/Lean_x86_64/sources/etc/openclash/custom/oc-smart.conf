# oc-smart 配置（本地"模型优选节点"）
# 改完直接生效，不用重启；改 CYCLE_MIN 后要重跑一次 oc-smart.sh --install-cron

# 每个节点保留多少条测试记录（你要的 10 次）
HISTORY=10

# 一轮测速的间隔（分钟），只影响 --install-cron 生成的定时任务
CYCLE_MIN=5

# 单节点测速超时(ms) / 测速地址
# 测速地址用 HTTPS（gstatic 是 Google 的域名）：明文 HTTP 能过、但 TLS 到 Google 被墙的节点，
# 只有 HTTPS 测得出来 —— 这正是"分组看着有延迟却打不开 google"的常见原因。
TIMEOUT=3000
TEST_URL=https://www.gstatic.com/generate_204

# 切换容差：新节点要比当前节点同时满足"快 TOLERANCE_MS 毫秒"且"快 TOLERANCE_PCT %"才切
TOLERANCE_MS=30
TOLERANCE_PCT=10

# 同一组两次自动切换的最小间隔(秒) / 手动改过之后让位多久(秒)
# 让位时间别设太长：如果手动选到的节点其实不好，模型会一直不动（30 分钟太久了）
MIN_SWITCH_INTERVAL=120
MANUAL_HOLD=300

# 看门狗：状态文件超过这么多分钟没更新，就认为模型挂了，把分组交回内核(url-test)自管
STALE_MINUTES=30

# 并发测速数 / 至少几条记录才参与稳定性评选
# 注意：198 个节点只对应 93 台服务器（一台最多挂 34 个），并发打同一台会被限速。
#       脚本已经做了"同一台服务器串行"，所以并发数指的是"同时测多少台不同服务器"，6 足够。
CONCURRENCY=8
MIN_SAMPLES=3

# 快速守护(guard，每分钟)发现当前节点连测两次都不通时，最多实测几个候选节点再决定换哪个。
# 以前是"按历史分数直接换"，结果可能换到另一个死节点（体感就是"换了还是打不开"）；
# 现在改成"候选逐个实测，第一个通的才换"。值越大越稳、但单次耗时越长（每个最多 TIMEOUT）。
GUARD_VERIFY_MAX=6

# 模型接管的「节点级」分组（成员是真实节点）—— 模型在这些组的成员里选，不跨组
NODE_GROUPS=♻️ 自动选择|♻️ 香港自动|♻️ 亚洲自动|♻️ 美国自动|♻️ 其他自动|🕸️ CHATGPT自动

# 分组专用测速地址（可写多行，格式：分组名|测速地址|期望状态码(可省)|超时ms(可省)）
#   ChatGPT 组用 chatgpt.com 自己的地址测：通用地址通了不代表能开 ChatGPT
#   期望状态码 200 = 只有真返回 200 才算通，被 Cloudflare 挡/地区受限(403) 算失败
#   超时给到 8 秒：chatgpt.com 是 HTTPS+Cloudflare，首次 TLS 握手比 generate_204 慢得多，
#   3 秒会把好节点误判成超时（实测有的节点 3s 超时、10s 只要 400ms）
GROUP_TEST_URL=🕸️ CHATGPT自动|https://chatgpt.com/cdn-cgi/trace|200|10000
# 想更严格（地区可用性）可换成下面这条：401 = 该节点 IP 被 OpenAI 认可（未带 key 的必然响应）
#GROUP_TEST_URL=🕸️ CHATGPT自动|https://api.openai.com/v1/models|401|8000

# 模型接管的「分类级」分组（成员是别的分组）—— 默认不接管，需要就填，用 | 分隔
# 例：CATEGORY_GROUPS=🤖 AI平台|📲 社交聊天|💻 开发平台|🎥 国外媒体|Ⓜ️ 微软苹果|🐟 漏网之鱼
CATEGORY_GROUPS=

# 永远不自动选的候选（保持策略语义：直连/拦截组不会被模型切走）
NEVER=DIRECT|REJECT|REJECT-DROP|PASS|COMPATIBLE
